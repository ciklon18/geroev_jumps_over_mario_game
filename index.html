<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b2b3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Грибок">
<meta name="description" content="Ты — грибок. Марио прыгает на тебя. Уворачивайся!">
<title>Грибок против Марио</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #1b1b24; color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; touch-action: none;
  }
  #game { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #rotate {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; text-align: center; padding: 24px;
    background: #1b1b24; font-size: 18px; line-height: 1.4; z-index: 10;
  }
  #rotate b { font-size: 40px; }
  @media (orientation: portrait) {
    #rotate.hint { display: flex; animation: fadeout 0.2s 2.6s forwards; }
  }
  @keyframes fadeout { to { opacity: 0; visibility: hidden; } }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="rotate" class="hint">
    <b>📱↻</b>
    <div>Поверни телефон горизонтально —<br>так играть удобнее</div>
    <div style="opacity:.6;font-size:15px">(или играй так, кнопки уже на экране)</div>
  </div>
  <script src="sfx.js"></script>
  <script src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
